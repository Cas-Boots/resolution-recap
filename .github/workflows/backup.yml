name: Daily Backup

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: daily-backup
  cancel-in-progress: false

# Required for pushing commits back to the repository
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing required secret: APP_URL"
            exit 1
          fi
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "Missing required secret: BACKUP_TOKEN"
            exit 1
          fi

      - name: Define backup filename
        run: echo "BACKUP_FILE=backups/backup-$(date -u +%Y-%m-%d).json" >> "$GITHUB_ENV"

      - name: Create backups directory
        run: mkdir -p backups

      - name: Fetch backup from server
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$APP_URL/api/export" \
            -o "$BACKUP_FILE"

      - name: Check if backup was successful
        run: |
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "Backup file is empty or missing"
            exit 1
          fi
          python -m json.tool "$BACKUP_FILE" > /dev/null
          python - <<'PY'
import json, os, sys
path = os.environ['BACKUP_FILE']
with open(path, 'r', encoding='utf-8') as f:
    payload = json.load(f)
required = {'seasons', 'people', 'metrics', 'entries'}
if not isinstance(payload, dict) or not required.issubset(payload.keys()):
    print(f"Backup payload structure invalid in {path}")
    sys.exit(1)
PY

      - name: Remove backups older than 30 days
        run: |
          find backups -name "backup-*.json" -mtime +30 -delete || true

      - name: Rebase on latest main
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Daily backup $(date -u +%Y-%m-%d)"
          git push
