name: Daily Backup

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: daily-backup
  cancel-in-progress: false

# Required for pushing commits back to the repository
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing required secret: APP_URL"
            exit 1
          fi
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "Missing required secret: BACKUP_TOKEN"
            exit 1
          fi

      - name: Define backup filename
        run: echo "BACKUP_FILE=backups/backup-$(date -u +%Y-%m-%d).json" >> "$GITHUB_ENV"

      - name: Define DB backup filename
        run: echo "DB_BACKUP_FILE=backups/db-$(date -u +%Y-%m-%d).db.gz" >> "$GITHUB_ENV"

      - name: Create backups directory
        run: mkdir -p backups

      - name: Fetch backup from server
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$APP_URL/api/export" \
            -o "$BACKUP_FILE"

      - name: Fetch SQLite backup from server
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            -D /tmp/db-response-headers.txt \
            "$APP_URL/api/backup/db" \
            -o "$DB_BACKUP_FILE"
          ROW_COUNTS=$(grep -i '^x-backup-row-counts:' /tmp/db-response-headers.txt | cut -d':' -f2- | tr -d '[:space:]') || true
          echo "Server row counts: ${ROW_COUNTS:-unknown}"

      - name: Check if backup was successful
        run: |
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "Backup file is empty or missing"
            exit 1
          fi
          python -m json.tool "$BACKUP_FILE" > /dev/null
          python - <<'PY'
import json, os, sys
path = os.environ['BACKUP_FILE']
with open(path, 'r', encoding='utf-8') as f:
    payload = json.load(f)
required = {'seasons', 'people', 'metrics', 'entries'}
if not isinstance(payload, dict) or not required.issubset(payload.keys()):
    print(f"Backup payload structure invalid in {path}")
    sys.exit(1)
PY

      - name: Verify backup consistency
        run: |
          gunzip -c "$DB_BACKUP_FILE" > /tmp/snapshot.db
          python - <<'PY'
import json, os, subprocess, sys
json_path = os.environ['BACKUP_FILE']
sqlite_path = '/tmp/snapshot.db'
with open(json_path, 'r', encoding='utf-8') as f:
    jdata = json.load(f)
tables = ['seasons', 'people', 'metrics', 'entries', 'entry_audit', 'goals', 'achievements', 'countries_visited']
core_tables = ['seasons', 'people', 'metrics', 'entries']
failures = []
print(f"\n{'Table':<25} {'SQLite':<10} {'JSON':<10} Status")
print('-' * 55)
for table in tables:
    result = subprocess.run(
        ['sqlite3', sqlite_path, f'SELECT COUNT(*) FROM {table}'],
        capture_output=True, text=True
    )
    if result.returncode != 0:
        failures.append(f'{table}: table missing from SQLite ({result.stderr.strip()})')
        print(f'{table:<25} {"missing":<10} {"-":<10} ERROR')
        continue
    sqlite_count = int(result.stdout.strip())
    json_count = len(jdata.get(table, []) or [])
    if sqlite_count != json_count:
        failures.append(f'{table}: SQLite={sqlite_count}, JSON={json_count}')
        status = 'MISMATCH'
    elif table in core_tables and sqlite_count == 0:
        failures.append(f'{table}: core table is empty')
        status = 'EMPTY'
    else:
        status = 'OK'
    print(f'{table:<25} {sqlite_count:<10} {json_count:<10} {status}')
print()
if failures:
    print('VERIFICATION FAILED:')
    for f in failures:
        print(f'  - {f}')
    sys.exit(1)
print('All checks passed.')
PY

      - name: Rebase on latest main
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add "$BACKUP_FILE" "$DB_BACKUP_FILE"
          git diff --staged --quiet || git commit -m "Daily backup $(date -u +%Y-%m-%d)"
          git push
