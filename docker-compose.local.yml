services:
  app:
    build: .
    user: root
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - TZ=Europe/Amsterdam
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=5173
      - DB_PATH=/app/data/local-test.db
      - TRACKER_PIN=${TRACKER_PIN:-1111}
      - ADMIN_PIN=${ADMIN_PIN:-9999}
      - BACKUP_TOKEN=${BACKUP_TOKEN:-local-backup-token}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-1}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL:-300}
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - ./data:/app/data
      - local-node-modules:/app/node_modules

volumes:
  local-node-modules:
