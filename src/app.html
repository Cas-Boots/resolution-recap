<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#6366f1" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Recap" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<title>Resolution Recap</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					const isLocalHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);

					if (isLocalHost) {
						navigator.serviceWorker.getRegistrations().then((registrations) => {
							for (const registration of registrations) {
								registration.unregister().catch(() => {});
							}
						});
						return;
					}

					const manifestLink = document.querySelector('link[rel="manifest"]');
					const basePath = manifestLink ? manifestLink.href.replace('/manifest.json', '') : '';
					const swPath = basePath ? basePath + '/service-worker.js' : '/service-worker.js';

					let reloadedOnControllerChange = false;
					navigator.serviceWorker.addEventListener('controllerchange', () => {
						if (reloadedOnControllerChange) return;
						reloadedOnControllerChange = true;
						window.location.reload();
					});

					navigator.serviceWorker.register(swPath, { scope: basePath || '/' })
						.then((registration) => {
							console.log('SW registered:', registration.scope);

							if (registration.waiting) {
								registration.waiting.postMessage({ type: 'SKIP_WAITING' });
							}

							registration.addEventListener('updatefound', () => {
								const newWorker = registration.installing;
								if (!newWorker) return;

								newWorker.addEventListener('statechange', () => {
									if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
										newWorker.postMessage({ type: 'SKIP_WAITING' });
									}
								});
							});

							registration.update().catch(() => {});
							setInterval(() => {
								registration.update().catch(() => {});
							}, 5 * 60 * 1000);
						})
						.catch((err) => console.log('SW registration failed:', err));
				});
			}
		</script>
	</body>
</html>
